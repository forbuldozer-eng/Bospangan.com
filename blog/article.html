  <style>
    :root{--ink:#193e34;--green:#195d43;--line:#dce3d7}
    *{box-sizing:border-box}
    body{margin:0;background:#fbfcf8;color:var(--ink);font:17px/1.75 system-ui,sans-serif}
    a{color:#176343}
    .site-header{background:#0d461a;color:#fff;box-shadow:0 2px 8px #102b421c}
    .header-inner{width:min(1320px,94%);margin:auto}
    .header-top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:15px 0}
    .brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:900}
    .brand img{width:72px;height:68px;object-fit:contain}
    .brand-copy{display:grid;line-height:1.15}
    .brand-name{font-size:19px;letter-spacing:.03em}
    .brand-slogan{font-size:12px;font-weight:700}
    .main-nav{display:flex;justify-content:center;gap:clamp(16px,4vw,48px);padding:12px 0 18px;flex-wrap:wrap}
    .main-nav a{color:#fff;text-decoration:none;font-weight:650}
    main{width:min(900px,92%);min-height:60vh;margin:28px auto 0}
    .crumb{font-size:14px;color:#587065;margin:18px 0 24px}
    .crumb a{color:inherit}
    h1{font:700 clamp(34px,6vw,54px)/1.12 Georgia,serif;letter-spacing:-.04em;margin:12px 0}
    h2{font-size:27px;line-height:1.25;margin-top:38px}
    h3{font-size:20px}
    p,li{max-width:75ch}
    .lead{font-size:20px;color:#435c50}
    .meta{font-size:14px;color:#65766b}
    .heroimg{display:block;width:100%;height:auto;max-height:520px;object-fit:cover;border-radius:18px;background:#eaf0dd;margin:24px 0}
    .article-content img{max-width:100%;height:auto;border-radius:12px}
    .article-content ul,.article-content ol{padding-left:26px}
    .article-content li{margin:6px 0}
    .article-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:22px 0}
    .article-gallery img{display:block;width:100%;height:260px;object-fit:cover;border-radius:12px}
    .article-gallery img:only-child{grid-column:1/-1}
    .callout{background:#f7f7ed;padding:18px 22px;border-radius:14px;margin:28px 0}
    .btn{display:inline-block;background:var(--green);color:#fff;padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:700}
    .related{border-top:1px solid var(--line);padding:20px 0;margin-top:38px}
    footer{width:min(900px,92%);border-top:1px solid var(--line);padding:24px 0 50px;margin:40px auto 0;font-size:14px}
    .article-not-found{padding:50px 0}
    @media(max-width:600px){.header-top{gap:8px}.brand img{width:56px;height:54px}.brand-name{font-size:15px}.brand-slogan{font-size:10px}.main-nav{gap:14px}.main-nav a{font-size:13px}.lead{font-size:18px}.article-gallery{grid-template-columns:1fr}.article-gallery img{height:auto;max-height:360px}}
  
/* Shared Bos Pangan navigation: centered and always one horizontal row */
.site-header .main-nav,.main-nav,.site-header nav{display:flex!important;flex-flow:row nowrap!important;align-items:center;justify-content:center!important;gap:clamp(12px,2vw,28px)!important;width:100%;box-sizing:border-box;white-space:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;-webkit-overflow-scrolling:touch;padding:14px 12px!important;margin:0 auto}
.site-header .main-nav>a,.main-nav>a,.site-header nav>a{display:inline-flex;align-items:center;flex:0 0 auto;white-space:nowrap;color:#fff!important;text-decoration:none;font-size:clamp(12px,1.25vw,17px)!important;font-weight:700}
.site-header .info-menu,.info-menu{display:none!important}
@media(max-width:760px){.site-header .main-nav,.main-nav,.site-header nav{justify-content:flex-start!important;gap:18px!important;padding:12px 14px!important}.site-header .main-nav>a,.main-nav>a,.site-header nav>a{font-size:13px!important}}
</style>
